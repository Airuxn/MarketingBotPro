name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-placeholder-not-used
      LINKEDIN_CLIENT_ID: ci-placeholder
      LINKEDIN_CLIENT_SECRET: ci-placeholder
      TWITTER_CLIENT_ID: ci-placeholder
      TWITTER_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npm run build

      - name: Dependency audit (critical only)
        run: npm audit --audit-level=critical
