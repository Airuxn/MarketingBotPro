name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  node:
    name: Node (lint, typecheck, production build)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-placeholder-not-used
      LINKEDIN_CLIENT_ID: ci-placeholder
      LINKEDIN_CLIENT_SECRET: ci-placeholder
      TWITTER_CLIENT_ID: ci-placeholder
      TWITTER_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npm run build

  sync-tags:
    name: Sync release tags
    if: github.event_name == 'push'
    needs: [node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sync tags to HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git tag -fa latest -m "Latest main"
          git push origin refs/tags/latest --force
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ]; then
            git tag -fa "v${VERSION}" -m "Release v${VERSION}"
            git push origin "refs/tags/v${VERSION}" --force
          fi
